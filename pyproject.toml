[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paa"
version = "4.1.0"
description = "Personal Autonomous Cognitive Operating System Runtime — a local-first, event-sourced agent substrate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Devansh Gaur" }]
keywords = ["agents", "event-sourcing", "local-first", "cognitive-runtime"]

# ---------------------------------------------------------------------------
# Core dependencies are deliberately small. This runtime targets a machine with
# ~3.5 GB of free RAM; every heavyweight dependency (torch, qdrant, kuzu) is an
# opt-in extra with a working pure-Python fallback. See docs/adr/0001.
# ---------------------------------------------------------------------------
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "zstandard>=0.23",
    "structlog>=24.4",
    "typer>=0.12",
    "rich>=13.9",
    "httpx>=0.27",
    # Already pulled in by pydantic-settings; declared because we import it
    # directly to read provider keys out of `.env` (config.dotenv_value).
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Vector recall backed by a real HNSW index rather than the brute-force fallback.
vector = ["qdrant-client>=1.12"]
# Embedded C++ property-graph engine for multi-hop provenance traversal.
graph = ["kuzu>=0.11"]
# Real sentence embeddings. Pulls torch (~2 GB on disk); the hash-embedder
# fallback keeps the runtime functional without it.
embeddings = ["sentence-transformers>=3.3"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
# Real Ed25519 signing for the attested change bundle (SPEC 2 C7.2). The
# HMAC fallback stays importable without it, but attestation refuses to
# produce an ambiguous "signed" artifact unless the asymmetric backend is
# present; the documented `dev` install therefore carries this extra.
attest = ["cryptography>=42"]
redis = ["redis>=5.2"]
postgres = ["psycopg[binary,pool]>=3.2"]
# S3-backed cold lake for the Docker deployment (ADR-0019, ADR-0026). boto3
# speaks the S3 API; the filesystem CAS remains the laptop default.
s3 = ["boto3>=1.35"]
otel = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]
# The chat TUI front-end (SPEC 2 §3.2). Deliberately optional: `paa chat
# --plain` runs on the core install, so a minimal deployment never pulls a
# TUI framework it cannot display.
tui = ["textual>=8.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    # The API's own extra. Without it the whole tests/api/ directory skips
    # itself at import time ("needs the api extra"), so the suite that the
    # documented `pip install -e ".[dev]"` produces never exercises a single
    # route — and it says so by skipping, which is the quietest way to not
    # test something. The self-referential form is the one `all` already uses.
    "paa[api]",
    # The S3 driver's own extra, on the same argument. The live S3 suite
    # (tests/storage/test_s3_live.py) skips itself when the driver is absent,
    # so without this the documented `pip install -e ".[dev]"` produces an
    # environment in which the gate can pass while the S3 path is untested —
    # and the skip says so by *not* failing, which is the quietest way to not
    # test something. The suite still skips when no *server* is configured:
    # a missing driver is a missing dependency, and a missing server is a
    # missing server, and neither is a failure.
    "paa[s3]",
    # The real Ed25519 backend. Without it tests/attest/ fails loudly on the
    # asymmetric path; the documented `pip install -e ".[dev]"` must be able
    # to exercise what the CLI advertises, not merely install a verifier that
    # can be tricked by an honestly-labelled symmetric fallback.
    "paa[attest]",
    # The chat TUI's own extra. Without it tests/tui/ cannot even be
    # COLLECTED — the modules import `paa.tui.chat.app`, which imports
    # Textual at module scope — so the documented dev install errors at
    # collection instead of skipping, and `mypy src` reports 19 Any-subclass
    # artefacts in src/paa/tui/chat/. The suite skips itself when the extra
    # is absent ("needs the tui extra", the tests/api pattern); the dev
    # install carries the extra so the default shape exercises it.
    "paa[tui]",
]
all = [
    "paa[vector,graph,embeddings,api,redis,postgres,s3,otel,attest,tui]",
]

[project.scripts]
paa = "paa.cli.main:app"

[tool.hatch.build.targets.wheel]
# Two top-level packages, one wheel — deliberately not two distributions:
# the child SDK is versioned and frozen with the protocol it re-states
# (`paa-pipeline/1`, ADR-0055), so a `paa_pipeline` release that drifted
# from its host's wire would be a split-brain the protocol exists to
# prevent. The SDK imports nothing from `paa` (see its package docstring);
# the coupling is protocol-only and ships in the same artefact.
packages = ["src/paa", "src/paa_pipeline"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: tests that take more than a second",
    "adversarial: red-team probes that attack the coder tool boundaries as an adversary would",
    "requires_vector: needs the qdrant-client extra",
    "requires_graph: needs the kuzu extra",
    "requires_embeddings: needs the sentence-transformers extra",
    "requires_api: needs the fastapi/uvicorn extra",
    "requires_postgres: needs the psycopg extra and a live PostgreSQL server",
    "requires_s3: needs the boto3 extra and a live S3 server (PAA_TEST_S3_ENDPOINT)",
    "requires_attest: needs the cryptography extra (paa[attest])",
    "chaos: crash-injection and recovery tests",
]
filterwarnings = ["error::DeprecationWarning:paa.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",     # assert is fine in this codebase's invariant checks
    "B008",     # FastAPI Depends() in defaults is idiomatic
    # `class X(str, Enum)` rather than `StrEnum`. The two differ in __str__ and
    # format() behaviour; this codebase always passes `.value` explicitly and
    # round-trips enums through pydantic and SQLite TEXT columns. Switching
    # would change serialisation semantics across the ledger for no gain.
    "UP042",
    # Aimed at trio/anyio codebases. This runtime is asyncio, and the flagged
    # calls are single stat()s on a local path during recovery — microseconds,
    # not a starvation risk. Genuinely blocking I/O goes through
    # asyncio.to_thread (see the kuzu and embedder backends).
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
# S608 flags f-string SQL as injection-prone. In these modules the interpolated
# value is always a module-level column-list constant, never caller input —
# parameters are bound with `?` throughout. Scoped to the files that legitimately
# do this so a genuine interpolation elsewhere still fails the build.
"src/paa/ledger/store.py" = ["S608"]
# SIM905: the stopword list is kept as split text, not a 50-element literal —
# a deliberate readability trade (see the comment at _STOPWORDS).
"src/paa/agents/context_agents.py" = ["S608", "SIM905"]
# ASYNC109 wants the caller to wrap an `asyncio.timeout()` instead of passing
# a `timeout` parameter. The sandbox session's read() deliberately owns its
# budget: the spec's own API is "timeout kwarg, asyncio.wait_for" (the budget
# travels with the read, like every duplex protocol call), and a caller
# wrapping every read in a context manager would be re-stating the same
# budget per call with more syntax. Scoped to the two files that define the
# session contract so a genuinely parameter-less future can still be flagged.
"src/paa/sandbox/base.py" = ["ASYNC109"]
"src/paa/sandbox/subprocess_backend.py" = ["ASYNC109"]
# Same rule, the tests' side: the LineReader helper and the bounded pollers
# mirror the session API under test — passing the budget as a parameter is
# the behaviour being exercised, not incidental style.
"tests/sandbox/test_session.py" = ["ASYNC109"]
"src/paa/observability/runs.py" = ["S608"]
"src/paa/storage/coldlake/artifacts.py" = ["S608"]
"src/paa/storage/coldlake/signals.py" = ["S608"]
"src/paa/storage/graph/sqlite_backend.py" = ["S608"]
# S105 reads `PERM_SECRET_READ` / a verdict constant as a hardcoded password.
# Both are capability names, not credentials.
"src/paa/core/types.py" = ["S105"]
"src/paa/validation/engine.py" = ["S105"]
# config.py names *env var names* for secrets (e.g. `s3_secret_key_env`,
# `escalation_api_key_env`) — the names of where to read a secret from, never a
# secret value. S105 cannot tell the difference.
"src/paa/config.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
